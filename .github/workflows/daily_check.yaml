name: QQQ Daily Monitor

on:
  schedule:
    - cron: '30 0 * * 1-5' 
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Bot
        run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      
      - name: Read Signal Status
        id: check_status
        run: echo "changed=$(cat signal_changed.txt)" >> $GITHUB_OUTPUT
      
      - name: Commit state
        if: steps.check_status.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_signal.txt
          git commit -m "Update last_signal.txt: Signal Changed"
          git push