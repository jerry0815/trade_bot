name: QQQ Daily Monitor

on:
  schedule:
    - cron: '30 0 * * 1-5' 
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py
       - name: Read Signal Status
        id: check_status
        run: echo "changed=$(cat signal_changed.txt)" >> $GITHUB_OUTPUT
      
      - name: Commit state
        if: steps.check_status.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_signal.txt
          git commit -m "Update last_signal.txt: Signal Changed"
          git push origin