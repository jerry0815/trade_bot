name: Collar Overlay Monitor

# Daily scan of the collar overlay (the backtest's winning model): today's trend
# regime, the target equity allocation, and the collar to run (sell ~20d call +
# buy ~15d put on the TQQQ held), with a best-effort look at the live chain.
# Alert-only. Posts to Discord via OPTIONS_DISCORD_WEBHOOK (its own channel) if
# set, else the shared DISCORD_WEBHOOK secret bot.py uses. Set the secret in repo
# settings; if neither is set the report is just printed to the Actions log.

on:
  schedule:
    # 00:45 UTC on weekdays — offset from daily_check.yaml (00:30) so the two
    # jobs don't hit Yahoo Finance at the same moment.
    - cron: '45 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-options-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run options monitor
        run: python -m options.live_monitor
        env:
          # Prefer a dedicated options channel; fall back to the shared bot
          # webhook if OPTIONS_DISCORD_WEBHOOK is not set.
          OPTIONS_DISCORD_WEBHOOK: ${{ secrets.OPTIONS_DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
